<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Træningsnav</title>
  <!-- Vægtløfter med stangen over hovedet. Brand-gradienten: pink øverst, rød nederst. -->
  <defs>
    <linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="456">
      <stop offset="0" stop-color="#FB2A7E"/>
      <stop offset="1" stop-color="#F82020"/>
    </linearGradient>
  </defs>
  <g fill="url(#brand)" stroke="url(#brand)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stang og vægtskiver -->
    <line x1="96" y1="118" x2="416" y2="118" stroke-width="18"/>
    <rect x="52" y="70" width="38" height="96" rx="12" stroke="none"/>
    <rect x="96" y="86" width="22" height="64" rx="8" stroke="none"/>
    <rect x="422" y="70" width="38" height="96" rx="12" stroke="none"/>
    <rect x="394" y="86" width="22" height="64" rx="8" stroke="none"/>
    <!-- Arme strakt op -->
    <line x1="214" y1="238" x2="170" y2="122" stroke-width="30" fill="none"/>
    <line x1="298" y1="238" x2="342" y2="122" stroke-width="30" fill="none"/>
    <!-- Hoved -->
    <circle cx="256" cy="186" r="30" stroke="none"/>
    <!-- Krop -->
    <path d="M206 236 H306 L290 336 H222 Z" stroke-width="22"/>
    <!-- Ben i bred stand -->
    <line x1="236" y1="334" x2="196" y2="448" stroke-width="36" fill="none"/>
    <line x1="276" y1="334" x2="316" y2="448" stroke-width="36" fill="none"/>
  </g>
</svg>
